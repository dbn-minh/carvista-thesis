name: Render Keep Alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      health_url:
        description: "Optional override for the Render health URL"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: render-keepalive
  cancel-in-progress: true

jobs:
  ping:
    name: Ping Render health endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      RENDER_HEALTH_URL: ${{ github.event.inputs.health_url || vars.RENDER_HEALTH_URL || secrets.RENDER_HEALTH_URL }}
    steps:
      - name: Skip when no Render URL is configured
        if: ${{ env.RENDER_HEALTH_URL == '' }}
        run: |
          echo "Set RENDER_HEALTH_URL as a repository variable or secret to enable keep-alive pings."

      - name: Ping health endpoint
        if: ${{ env.RENDER_HEALTH_URL != '' }}
        run: |
          echo "Pinging Render health endpoint..."
          curl --fail --silent --show-error --location --max-time 25 --retry 2 --retry-delay 5 "$RENDER_HEALTH_URL"
